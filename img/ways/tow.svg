<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Tow truck">
  <!-- Drawn for car2door.eu (no photo): a flatbed tow truck carrying a car that doesn't drive. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1330"/><stop offset=".72" stop-color="#16224A"/><stop offset="1" stop-color="#0B1124"/></linearGradient>
    <radialGradient id="glow" cx=".45" cy=".78" r=".62"><stop offset="0" stop-color="#FF6A13" stop-opacity=".24"/><stop offset="1" stop-color="#FF6A13" stop-opacity="0"/></radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2646"/><stop offset="1" stop-color="#0B1124"/></linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A45"/><stop offset="1" stop-color="#E2550A"/></linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9EEF5"/><stop offset="1" stop-color="#B9C4D3"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE7B8" stop-opacity=".55"/><stop offset="1" stop-color="#FFE7B8" stop-opacity="0"/></linearGradient>
    <radialGradient id="flash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFB020" stop-opacity=".8"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g fill="#FFC861" opacity=".55"><circle cx="40" cy="306" r="2"/><circle cx="118" cy="314" r="1.5"/><circle cx="182" cy="302" r="2"/><circle cx="520" cy="308" r="1.5"/><circle cx="598" cy="300" r="2"/><circle cx="760" cy="310" r="1.5"/></g>
  <path d="M0 322 Q140 300 260 316 T520 310 T800 318 V356 H0Z" fill="#131D3B"/>
  <rect y="352" width="800" height="148" fill="url(#road)"/>
  <path d="M0 452 H800" stroke="#fff" stroke-opacity=".22" stroke-width="5" stroke-dasharray="46 34"/>
  <ellipse cx="420" cy="420" rx="320" ry="14" fill="#000" opacity=".35"/>
  <path d="M742 352 L800 332 V392 Z" fill="url(#beam)"/>
  <!-- chassis and the flatbed -->
  <rect x="150" y="356" width="590" height="16" rx="4" fill="#26324F"/>
  <path d="M86 340 H584 V326 H112 Z" fill="#3B4A6A"/>
  <path d="M86 340 l-22 24" stroke="#3B4A6A" stroke-width="8" stroke-linecap="round"/>
  <path d="M150 356 l-30-16 M300 356 l-20-16 M440 356 l-20-16" stroke="#26324F" stroke-width="6"/>
  <!-- the car on the bed, with the winch line to its front -->
  <path d="M120 322 q-8 0-8-10 v-18 q0-11 12-13 l40-7 l40-30 q9-7 20-7 h100 q13 0 21 8 l34 30 l38 6 q15 3 15 17 v14 q0 10-10 10 z" fill="url(#car)"/>
  <path d="M214 253 l-30 24 h84 v-28 h-44 q-6 0-10 4z M282 249 v28 h80 l-26-23 q-5-5-12-5z" fill="#1F2B48"/>
  <circle cx="170" cy="320" r="20" fill="#0B1124"/><circle cx="170" cy="320" r="8" fill="#6B7A96"/>
  <circle cx="378" cy="320" r="20" fill="#0B1124"/><circle cx="378" cy="320" r="8" fill="#6B7A96"/>
  <path d="M432 300 L586 286" stroke="#AEB9C9" stroke-width="3" stroke-dasharray="2 4"/>
  <path d="M132 326 l16-16 M406 326 l-16-16" stroke="#FFB020" stroke-width="3"/>
  <!-- the cab -->
  <path d="M590 236 q0-14 14-14 h76 q18 0 28 15 l34 48 q8 11 8 24 v62 q0 10-10 10 h-150 z" fill="url(#cab)"/>
  <path d="M672 242 h-36 v58 h74 q6 0 3-6 l-24-42 q-6-10-17-10z" fill="#1F2B48"/>
  <rect x="590" y="300" width="150" height="8" fill="#0E1726" opacity=".25"/>
  <rect x="644" y="214" width="26" height="9" rx="3" fill="#FFB020"/>
  <circle cx="657" cy="214" r="22" fill="url(#flash)"/>
  <circle cx="474" cy="392" r="26" fill="#0B1124"/><circle cx="474" cy="392" r="11" fill="#AEB9C9"/>
  <circle cx="530" cy="392" r="26" fill="#0B1124"/><circle cx="530" cy="392" r="11" fill="#AEB9C9"/>
  <circle cx="694" cy="392" r="26" fill="#0B1124"/><circle cx="694" cy="392" r="11" fill="#AEB9C9"/>
  <rect x="728" y="344" width="14" height="10" rx="3" fill="#FFE7B8"/>
  <rect x="80" y="334" width="8" height="12" rx="2" fill="#FF6B6F"/>
</svg>
